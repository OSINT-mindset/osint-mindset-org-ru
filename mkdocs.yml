site_name: OSINT mindset
site_url: https://osint-mindset.com
site_description: Сообщество OSINT специалистов - митапы, гайды, ток-шоу и обучающие материалы
site_author: OSINT mindset Community

# Markdown хранится в каталоге docs/
docs_dir: docs

theme:
  name: material
  language: ru
  
  # Цветовая палитра с вашим фирменным цветом
  palette:
    # Светлая тема
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    
    # Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  
  # Шрифты для лучшей читаемости
  font:
    text: Roboto
    code: Roboto Mono
  
  # Иконка сайта
  favicon: assets/avatar.png
  logo: assets/avatar.png
  
  # Расширенные функции Material
  features:
    # Навигация
    # - navigation.instant        # Отключено для совместимости с i18n
    # - navigation.instant.prefetch  # Отключено для совместимости с i18n
    # - navigation.instant.progress  # Отключено для совместимости с i18n
    - navigation.tracking       # Отслеживание якорей в URL
    - navigation.sections       # Секции в навигации
    - navigation.path           # Путь навигации (breadcrumbs)
    - navigation.indexes        # Индексные страницы разделов
    - navigation.top            # Кнопка "Наверх"
    - navigation.footer         # Навигация в футере
    
    # Поиск
    - search.suggest            # Автодополнение поиска
    - search.highlight          # Подсветка результатов
    - search.share              # Поделиться результатами
    
    # Контент
    - content.code.copy         # Копирование кода
    - content.code.select       # Выделение кода
    - content.code.annotate     # Аннотации в коде
    - content.tabs.link         # Связанные вкладки контента
    - content.tooltips          # Всплывающие подсказки
    - content.action.edit       # Кнопка редактирования
    - content.action.view       # Кнопка просмотра
    
    # Таблицы содержания
    - toc.follow                # Следование за прокруткой
    - toc.integrate             # Интегрированное оглавление

# Дополнительные стили для вашего фирменного цвета
extra_css:
  - stylesheets/extra.css

# Плагины для расширенной функциональности
plugins:
  - search:
      lang: 
        - ru
        - en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          default: true
          name: Русский
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            🏠 Главная: 🏠 Home
            👥 Кто есть кто в OSINT: 👥 Who is Who in OSINT
            📽️ Видео: 📽️ Videos
            📱 Все наши соцсети: 📱 All Our Social Media
            🌐 Комьюнити: 🌐 Community
            📰 Что почитать: 📰 Reading List
            🍰 Митапы и подкасты: 🍰 Meetups & Podcasts
            🕵️ Анонимность: 🕵️ Anonymity
            🗺️ Геолокация / GEOINT: 🗺️ Geolocation / GEOINT
            🔒 Информационная безопасность: 🔒 Information Security
            💰 Криптовалюты: 💰 Cryptocurrencies
            🌍 OSINT в разных сферах жизни: 🌍 OSINT in Different Areas
            📖 Основы: 📖 Basics
            ⚖️ Правовые основы: ⚖️ Legal Basics
            🤝 Взаимодействие с людьми: 🤝 Human Interaction
            Руководства: Guides
            🌠 Как начать путь в OSINT: 🌠 How to Start in OSINT
            👣 Введение в OSINT-расследования: 👣 Introduction to OSINT Investigations
  - tags
  
# Расширения Markdown
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Ссылка на этот раздел
      toc_depth: 3
  
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Дополнительная конфигурация
extra:
  # Социальные ссылки
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/osint_mindset
      name: Telegram канал
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@osint_mindset
      name: YouTube канал
    - icon: fontawesome/brands/github
      link: https://github.com/osint-mindset
      name: GitHub
  
  # Alternate языки для SEO
  alternate:
    - name: Русский
      link: /
      lang: ru
    - name: English
      link: /en/
      lang: en
  
  # Аналитика (раскомментируйте и добавьте ваш ID)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
  
  # Генератор (можно отключить)
  generator: false
  
  # Статус документа
  status:
    new: Недавно добавлено
    deprecated: Устарело

# Информация об авторских правах
copyright: Copyright &copy; 2026 OSINT mindset Community

